[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hydromesh*"]

[project]
name = "hydromesh"
version = "0.1.0"
description = "Spatio-temporal deep-learning platform for Himalayan run-of-river hydropower plants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "redis>=5",
  "chromadb>=0.5",
  "sentence-transformers>=3",
  "scikit-learn>=1.5",
  "ollama>=0.3",
  "numpy",
  "polars",
  "joblib",
  "structlog>=24.1",
  "httpx>=0.27",
  "celery[redis]",
  "apscheduler",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "fakeredis",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
  "semgrep",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=hydromesh --cov-report=term-missing"

[tool.coverage.run]
omit = [
  "hydromesh/prompts.py",
]

[tool.coverage.report]
fail_under = 90
