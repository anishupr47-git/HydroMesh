[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromesh"
version = "0.1.0"
description = "Spatio-temporal deep-learning platform for Himalayan run-of-river hydropower plants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "redis>=5",
  "chromadb>=0.5",
  "sentence-transformers>=3",
  "scikit-learn>=1.5",
  "ollama>=0.3",
  "numpy",
  "polars",
  "joblib",
  "structlog",
  "httpx",
  "celery[redis]",
  "apscheduler",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio",
  "pytest-cov",
  "fakeredis",
  "hypothesis",
  "ruff",
  "mypy",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=hydromesh --cov-report=term-missing"
